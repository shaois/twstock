<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股 20 日獲利模型</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1e2d45;--accent:#00d4aa;--accent2:#3b82f6;--warn:#f59e0b;--text:#e2e8f0;--muted:#64748b;--green:#22c55e;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:14px;min-height:100vh;}
header{background:linear-gradient(135deg,#0d1b2e,#0a0e1a);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-size:18px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px;}
.version-badge{font-size:10px;line-height:1;color:#f8fafc;background:#334155;border:1px solid #475569;border-radius:4px;padding:4px 6px;font-family:'JetBrains Mono',monospace;font-weight:700;}
.cache-status{font-size:11px;color:var(--muted);border-left:1px solid var(--border);padding-left:10px;white-space:nowrap}
.cache-status.loaded{color:var(--green)}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.api-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace;width:220px;}
.api-input:focus{outline:none;border-color:var(--accent);}
.api-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace;}
.api-select:focus{outline:none;border-color:var(--accent);}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:'Noto Sans TC',sans-serif;font-weight:500;transition:all .15s;}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;}
.btn-primary{background:var(--accent);color:#000;}.btn-primary:hover{background:#00bfa0;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-gold{background:var(--warn);color:#000;font-weight:700;}.btn-gold:hover{background:#eab308;transform:scale(1.02);}
.layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 57px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;scrollbar-color:#475569 var(--surface);}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;padding:8px 16px 4px;}
.filter-wrap{padding:4px 12px 8px;}
.filter-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:5px;font-size:12px;}
#stockList{padding:4px 8px 12px;}
.stock-item{appearance:none;width:100%;min-height:42px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;color:var(--text);border:1px solid transparent;border-left:3px solid transparent;border-radius:6px;font:inherit;text-align:left;transition:background .12s,border-color .12s,color .12s;}
.stock-item>span{display:flex;align-items:center;gap:6px;min-width:0;}.stock-item>span:last-child{flex-shrink:0;}
.stock-item:hover{background:var(--surface2);border-color:var(--border);}.stock-item.active{background:rgba(0,212,170,.1);border-color:rgba(0,212,170,.28);border-left-color:var(--accent);}
.stock-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.s-id{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--accent2);}
.s-name{font-size:11px;color:var(--muted);white-space:nowrap;}
.model-badge{font-size:10px;font-weight:700;padding:2px 6px;border:1px solid rgba(0,212,170,.22);border-radius:4px;font-family:'JetBrains Mono',monospace;background:rgba(0,212,170,.12);color:var(--accent);}
.main{overflow-y:auto;padding:20px;background:var(--bg);}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:14px;color:var(--muted);}
.welcome h2{font-size:20px;color:var(--text);font-weight:500;}
.step-cards{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
.step-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;width:150px;text-align:center;}
.step-num{font-size:26px;color:var(--accent);font-weight:700;margin-bottom:6px;}
.step-text{font-size:11px;line-height:1.6;}
#progressBar{position:fixed;top:57px;left:0;right:0;z-index:200;background:var(--surface2);border-bottom:1px solid var(--border);padding:7px 18px;display:none;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
#progressBar.show{display:flex;}
.stock-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.stock-title h1{font-size:24px;font-weight:700;}
.stock-title .sub{color:var(--muted);font-size:13px;margin-top:2px;}
.score-overview{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.score-card .val{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1;margin-bottom:4px;}
.score-card .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
.panel-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.panel-title::before{content:'';display:inline-block;width:3px;height:11px;background:var(--accent);border-radius:2px;}
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.metric-row:last-child{border-bottom:none;}
.metric-name{color:var(--muted);font-size:12px;}
.metric-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;}
.metric-score{font-size:10px;padding:1px 5px;background:rgba(0,212,170,.15);color:var(--accent);border-radius:3px;margin-left:5px;}
.bar-row{display:flex;align-items:center;gap:8px;padding:5px 0;}
.bar-label{width:90px;font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;}
.bar-wrap{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.bar-val{width:28px;text-align:right;font-size:11px;font-family:'JetBrains Mono',monospace;}
.ai-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;}
.ai-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.ai-badge{font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 7px;background:rgba(59,130,246,.2);color:var(--accent2);border-radius:4px;}
.ai-content{line-height:1.9;color:var(--text);font-size:13px;white-space:pre-wrap;}
.ai-loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:10px 0;}
.spinner{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.inst-card{background:var(--surface2);border-radius:8px;padding:10px;text-align:center;}
.inst-lbl{font-size:9px;color:var(--muted);margin-bottom:4px;letter-spacing:.5px;}
.inst-val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;}
.screener-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{text-align:left;padding:7px 10px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
tbody tr{cursor:pointer;transition:background .1s;}tbody tr:hover{background:var(--surface2);}
tbody td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.03);}
.td-mono{font-family:'JetBrains Mono',monospace;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:12px;display:none;align-items:center;gap:8px;z-index:999;}
.toast.show{display:flex;}
@media(max-width:768px){.layout{grid-template-columns:1fr;}.sidebar{display:none;}.score-overview{grid-template-columns:repeat(2,1fr);}.detail-grid{grid-template-columns:1fr;}}
/* V94.4: readable dark surfaces, consistent controls, responsive layout. */
:root{--bg:#0b1220;--surface:#131e30;--surface2:#1c2c43;--border:#304259;--text:#edf3fb;--muted:#adbed3;--accent:#5ee6c3;--accent2:#8bbcff;--green:#71e0a1;--red:#ff979d;--warn:#f3c56c;}
body{line-height:1.6;height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
header{position:relative;flex-shrink:0;gap:16px;flex-wrap:wrap;padding:14px 24px;background:#101b2c;}
.logo{flex-wrap:wrap;color:var(--text);font-size:18px;gap:10px;}
.cache-status{font-size:12px;}.cache-status.loaded{color:#91dcbf;}
.layout{flex:1;min-height:0;height:auto;grid-template-columns:270px minmax(0,1fr);}
.sidebar{padding:18px 0;background:#111d2e;}
.sidebar-label{font-size:12px;letter-spacing:.6px;padding:10px 18px 8px;}
.filter-wrap{padding:0 14px 12px;}.filter-input{padding:10px 12px;font-size:14px;border-radius:8px;}
input::placeholder{color:#a9bbd0;opacity:1;}
.stock-item{min-height:50px;padding:10px 12px;border-radius:8px;}
.s-id{font-size:13px;color:#99c7ff;}.s-name{font-size:13px;color:#e1eaf5;}
.stock-item>span:last-child .s-name{font-size:12px;color:#b5c6da;}
.model-badge{font-size:11px;color:#87efd2;}
.stock-item.active{background:#1c3b43;border-color:#3c7c76;border-left-color:#5ee6c3;}
.main{min-width:0;padding:28px;scrollbar-color:#566e8b var(--bg);}
.btn,button{font:inherit;cursor:pointer;}
.screener-panel button,.panel button{background:#20334c;color:var(--text);border:1px solid #435c78;border-radius:8px;padding:8px 12px;}
button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #8bbcff;outline-offset:3px;}
.btn{min-height:38px;}.btn-primary{background:#5ee6c3;color:#082720;}.btn-gold{background:#f3c56c;color:#2c2107;}
.btn-secondary{color:#d9e6f5;}.panel,.screener-panel{padding:24px;border-radius:14px;}
.panel-title{font-size:13px;letter-spacing:.3px;color:#bed0e4;}
.metric-name,.metric-val{font-size:13px;}.metric-row{gap:20px;padding:10px 0;}.metric-val{text-align:right;}
.panel p{margin:12px 0;line-height:1.8;}#entryAssessment>div:not(.panel-title){padding:7px 0;border-bottom:1px solid #28394e;}
.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.panel h3{font-size:19px;margin-bottom:12px;}
.screener-panel{overflow-x:auto;}.decision-board{overflow:visible;}
table{font-size:13px;}thead th{font-size:12px;letter-spacing:0;padding:12px 14px;background:#1a293e;color:#c2d2e6;}
tbody td{padding:14px;border-bottom:1px solid #29394d;}tbody tr{cursor:default;}tbody tr:hover{background:#1b2c42;}
.board-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px;}
.board-eyebrow{font-size:12px;color:#7ee7ce;letter-spacing:1px;margin-bottom:4px;}.board-heading h2{font-size:24px;font-weight:700;letter-spacing:.4px;}
.board-subtitle{color:var(--muted);font-size:13px;margin-top:6px;}
.board-notice{padding:12px 16px;background:#1d2b3d;border-left:3px solid #f3c56c;border-radius:6px;color:#e2cfa8;font-size:13px;}
.board-explanation{margin-top:10px;color:var(--muted);font-size:13px;}.board-explanation summary{cursor:pointer;width:fit-content;padding:5px 0;}.board-explanation p{max-width:1000px;margin:8px 0;}
.board-filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 16px;}
.decision-board .filter-chip{display:inline-flex;align-items:center;gap:10px;background:#18263a;border:1px solid #3a506c;color:#cfdeef;padding:9px 13px;border-radius:9px;font-size:13px;}
.decision-board .filter-chip:hover{background:#243a53;border-color:#7392b5;}.decision-board .filter-chip.selected{background:#193e3e;border-color:#5eddbd;color:#aeffe8;}
.filter-count{background:#2b405b;border-radius:5px;padding:0 7px;font-variant-numeric:tabular-nums;font-weight:700;}.selected .filter-count{background:#2a5b52;color:#dcfff4;}
.board-table-meta{display:flex;justify-content:space-between;gap:12px;color:#adbed3;font-size:12px;margin-bottom:10px;}
.table-scroll{overflow:auto;border:1px solid #304259;border-radius:10px;}
.decision-table{min-width:780px;table-layout:fixed;}.decision-table th:nth-child(1){width:20%;}.decision-table th:nth-child(2){width:17%;}.decision-table th:nth-child(3){width:28%;}.decision-table th:nth-child(4){width:35%;}
.decision-table td{padding:17px 16px;vertical-align:middle;}.decision-table th{padding:13px 16px;}
.decision-table tbody tr:nth-child(even){background:#152237;}.decision-table tbody tr:hover{background:#21354d;}
.decision-board .stock-link{display:flex;align-items:center;flex-wrap:wrap;gap:8px;text-align:left;background:none;border:none;padding:4px 0;color:#f1f6ff;font-size:14px;font-weight:500;}
.stock-link:hover span:last-child{text-decoration:underline;text-underline-offset:4px;}.stock-code{color:#a1ceff;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;}
.probability-cell{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;color:#f3f7fd;font-variant-numeric:tabular-nums;}
.status-pill{display:inline-block;border-radius:6px;border:1px solid #46617d;padding:5px 9px;font-size:12px;line-height:1.6;color:#d8e5f5;background:#223249;}
.status-ready{background:#153d35;border-color:#386e60;color:#9cebcf;}.status-waiting{background:#3b3020;border-color:#77613b;color:#f2d49c;}.status-excluded{background:#2a3040;border-color:#505d75;color:#ccd6e7;}.status-missing{background:#3b2933;border-color:#775267;color:#f0bacd;}
.reason-cell{font-size:13px;line-height:1.8;color:#b9cbe0;overflow-wrap:anywhere;}.empty-state{text-align:center;padding:40px!important;color:#b9cbe0;}
@media(min-width:1700px){.main{padding:32px 40px;}.decision-table th:nth-child(1){width:18%;}.decision-table th:nth-child(2){width:16%;}.decision-table th:nth-child(3){width:26%;}.decision-table th:nth-child(4){width:40%;}}
@media(max-width:1100px){.layout{grid-template-columns:230px minmax(0,1fr);}.main{padding:18px;}.panel,.screener-panel{padding:18px;}.detail-grid{grid-template-columns:1fr;}.model-badge{display:none;}}
@media(max-width:768px){body{height:auto;min-height:100dvh;overflow:auto;}header{padding:12px 16px;}.logo{font-size:16px;}.cache-status{white-space:normal;width:100%;border:0;padding:0;}.header-right{width:100%;}.layout{display:block;}.sidebar{display:none;}.main{overflow:visible;padding:12px;}.board-heading h2{font-size:20px;}.board-table-meta{flex-direction:column;gap:2px;}.board-filters{gap:7px;}.decision-board .filter-chip{padding:8px 10px;}.board-heading>.btn{width:100%;}.stock-title h1{font-size:22px;}}
/* V94.5: secondary information remains bright and readable on dark surfaces. */
:root{--text:#f5f7fc;--muted:#d9e3f0;}
.sidebar-label,.panel-title,.metric-name,.bar-label,.inst-lbl,
.score-card .lbl,.board-subtitle,.board-explanation,.board-table-meta,
.stock-title .sub,.reason-cell,.empty-state{color:#d9e3f0;}
.s-name,.stock-item>span:last-child .s-name{color:#e8eff8;}
input::placeholder{color:#d1ddeb;opacity:1;}
thead th{color:#edf3fb;}
.decision-board .filter-chip,.btn-secondary{color:#edf3fb;}
.btn:disabled{opacity:1;background:#26364b;color:#d1ddeb;cursor:not-allowed;}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
      <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" stroke="#00d4aa" stroke-width="1.5" fill="rgba(0,212,170,.08)"/>
      <polyline points="7,18 11,12 15,16 21,9" stroke="#00d4aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    台股選股儀表板 <span class="version-badge">v94.5</span> <span id="cacheStatus" class="cache-status">快取：尚未載入</span>
  </div>
  <div class="header-right">
    <select hidden class="api-select" id="aiProvider" onchange="syncAIProvider()">
      <option value="groq">Groq</option>
      <option value="nvidia" selected>NVIDIA</option>
    </select>
    <select hidden class="api-select" id="aiModel">
      <option value="nvidia/nemotron-3.5-lightning-30b-a3b">NVIDIA Nemotron 3.5 Lightning</option>
    </select>
    <input hidden class="api-input" id="apiKeyInput" type="password" placeholder="停用的相容欄位">
    <button class="btn btn-primary" id="loadCacheBtn" onclick="loadStocks()">重新載入快取</button>
    <button class="btn btn-gold" id="rankingBtn" onclick="showDecisionBoard()" disabled>開啟免費條件清單</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-label">搜尋</div>
    <div class="filter-wrap">
      <input class="filter-input" id="stockSearch" type="search" placeholder="股票代碼或名稱" oninput="renderStockList()">
    </div>
    <div class="sidebar-label" style="margin-top:4px">股票清單 <span id="stockCount" style="color:var(--accent)"></span></div>
    <div id="stockList"><div style="padding:16px;color:var(--muted);font-size:12px">請點擊上方「載入」按鈕</div></div>
  </div>

  <div class="main">
    <div class="welcome" id="welcome">
      <svg width="56" height="56" viewBox="0 0 28 28" fill="none" style="opacity:.35">
        <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" stroke="#00d4aa" stroke-width="1.5" fill="rgba(0,212,170,.08)"/>
        <polyline points="7,18 11,12 15,16 21,9" stroke="#00d4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>台股 20 日獲利模型</h2>
      <p style="max-width:460px;line-height:1.8">每日依20日淨獲利估計機率排序，並比較0050淨報酬；研究候選，非投資建議。機率尚未完成獨立校準。</p>
    </div>
    <div id="stockDetail" style="display:none"></div>
    <div id="screenerResult" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="app.js?v=94.5"></script>
<script src="ai-review.js?v=94.5"></script>
</body>
</html>
