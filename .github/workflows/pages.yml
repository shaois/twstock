name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Daily FinMind Cache Refresh"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "build_ai_context.py"
      - "cache/price.json"
      - "cache/institutions.json"
      - "cache/universe.json"
      - "cache/predictions.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site/cache
          cp index.html _site/index.html
          cp app.js _site/app.js
          cp cache/universe.json _site/cache/universe.json
          cp cache/predictions.json _site/cache/predictions.json
          python3 build_ai_context.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
