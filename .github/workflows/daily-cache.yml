name: Daily FinMind Cache Refresh

on:
  schedule:
    # UTC Mon-Fri 13:00-20:00 = Taiwan 21:00-04:00, eight regular batches.
    # UTC 21:00/22:00 = Taiwan 05:00/06:00, two catch-up opportunities.
    # Date-based refresh skips current prices and retries pending stocks only.
    - cron: '0 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    - cron: '0 21 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# Scheduled triggers are fallback opportunities. Each run continues batches itself.
# Do not cancel an active refresh when another scheduled trigger arrives.
concurrency:
  group: daily-finmind-cache
  cancel-in-progress: false

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Refresh official market context
        run: python market_trend.py

      - name: Fetch FinMind data until complete
        id: refresh
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python refresh_until_complete.py

      - name: Refresh financial snapshots (at most 40 stocks)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python refresh_fundamentals.py --limit 40

      - name: Record short-term observations
        run: python short_term.py

      - name: Commit and push cache
        if: always() && steps.refresh.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/short_term.json cache/short_observations.json cache/short_rotation_observations.json
          git add cache/market_history.json cache/market_trend.json
          git add cache/price.json cache/benchmark.json cache/predictions.json cache/prediction_log.json cache/progress.json cache/universe.json cache/research_protocol.json cache/sectors.json cache/institutions.json cache/shadow_log.json
          git add cache/research_protocol.parts/
          if [ -d cache/universe_history ]; then git add cache/universe_history/; fi
          git add cache/three_gate.json cache/fundamentals_progress.json cache/fundamentals_status.json
          if [ -d cache/fundamentals ]; then git add cache/fundamentals/; fi
          if [ -d cache/fundamentals_raw ]; then git add cache/fundamentals_raw/; fi
          python protocol_storage.py
          git diff --staged --quiet || git commit -m "chore: update FinMind cache $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push


      - name: Report incomplete refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Refresh incomplete. Saved cache committed; next run resumes pending stocks."
          exit 1
