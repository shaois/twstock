name: Daily FinMind Cache Refresh

on:
  schedule:
    # Taiwan time 04:00-08:00. 5 batches x 40 stocks = 200 stocks per day.
    # The later window gives FinMind time to publish the previous trading day.
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# GitHub scheduled jobs can start late. Queue every batch so each checkout
# sees the progress committed by the preceding batch.
concurrency:
  group: daily-finmind-cache
  cancel-in-progress: false

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Fetch FinMind data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python update_all.py

      - name: Commit and push cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/*.json
          git diff --staged --quiet || git commit -m "chore: update FinMind cache $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
